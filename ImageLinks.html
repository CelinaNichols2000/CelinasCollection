<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Picker</title>
  <style>
    :root {
      --bg: #08080a;
      --panel: #121217;
      --panel2: #181820;
      --line: #292933;
      --text: #f4f4f5;
      --muted: #9ca3af;
      --neon: #b026ff;
      --neon2: #d946ef;
      --cyan: #06b6d4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(176, 38, 255, .25), transparent 430px),
        radial-gradient(circle at bottom right, rgba(217, 70, 239, .10), transparent 520px),
        var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif;
      padding: 18px;
    }

    .app {
      max-width: 1500px;
      margin: 0 auto;
    }

    .top {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topTitle {
      font-weight: 900;
      letter-spacing: -.03em;
      font-size: 18px;
    }

    .topSub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    button {
      background: linear-gradient(135deg, var(--neon), var(--neon2));
      color: white;
      border: 0;
      border-radius: 13px;
      padding: 11px 15px;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 0 24px rgba(176, 38, 255, .28);
    }

    button:hover { filter: brightness(1.1); }

    .main {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 14px;
    }

    .box {
      background: rgba(18, 18, 23, .94);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      min-height: 300px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
    }

    .head {
      height: 54px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255,255,255,.015);
    }

    .title {
      font-weight: 900;
      letter-spacing: -.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .folders {
      padding: 10px;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }

    .folder {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 9px;
      align-items: center;
      padding: 11px;
      border-radius: 13px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }

    .folder:hover { background: var(--panel2); }

    .folder.active {
      background: rgba(176, 38, 255, .18);
      border-color: rgba(176, 38, 255, .55);
      box-shadow: inset 0 0 22px rgba(176, 38, 255, .08);
    }

    .folder.jumpTarget {
      outline: 2px solid rgba(6, 182, 212, .95);
      outline-offset: 2px;
    }

    .folderName {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .gridWrap {
      max-height: calc(100vh - 110px);
      overflow: auto;
      padding: 16px;
    }

    .imageGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .imageCard {
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      background: #050507;
      cursor: pointer;
      position: relative;
      border: 2px solid rgba(176, 38, 255, .78);
      box-shadow:
        0 0 0 1px rgba(217, 70, 239, .22),
        0 0 24px rgba(176, 38, 255, .22),
        inset 0 0 22px rgba(176, 38, 255, .10);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }

    .imageCard:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(217, 70, 239, 1);
      box-shadow:
        0 0 0 1px rgba(217, 70, 239, .5),
        0 0 34px rgba(176, 38, 255, .42),
        0 18px 42px rgba(0, 0, 0, .35);
    }

    .imageCard img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .empty {
      padding: 42px 20px;
      color: var(--muted);
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(80px);
      opacity: 0;
      max-width: min(900px, calc(100vw - 28px));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #101014;
      color: var(--text);
      border: 1px solid rgba(176, 38, 255, .85);
      border-radius: 15px;
      padding: 13px 16px;
      box-shadow: 0 0 38px rgba(176,38,255,.35), 0 24px 90px rgba(0,0,0,.58);
      transition: .2s ease;
      z-index: 20;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 1200px) {
      .imageGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 850px) {
      .top { align-items: stretch; flex-direction: column; }
      .main { grid-template-columns: 1fr; }
      .folders, .gridWrap { max-height: none; }
      .imageGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      body { padding: 10px; }
      .imageGrid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <div class="topTitle">Image Picker</div>
        <div class="topSub">C:\Users\PC\OneDrive\Desktop\images</div>
      </div>
      <div>
        <button id="chooseBtn">Ordner einmal freigeben</button>
      </div>
    </div>

    <div class="main">
      <div class="box">
        <div class="head">
          <div class="title">Ordner</div>
          <div class="count" id="folderCount">0</div>
        </div>
        <div class="folders" id="folders">
          <div class="empty">Gespeicherten Bilderordner laden...</div>
        </div>
      </div>

      <div class="box">
        <div class="head">
          <div class="title" id="currentFolder">Kein Ordner gewählt</div>
          <div class="count" id="imageCount">0 Bilder</div>
        </div>
        <div class="gridWrap" id="gridWrap">
          <div class="empty">Warte auf Bilderordner...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CLOUDFLARE_DOMAIN = "https://images.celinascollection.com";
    const LOCAL_ROOT_FOLDER_NAME = "images";
    const HANDLE_DB_NAME = "image-links-local-folders";
    const HANDLE_STORE_NAME = "handles";
    const HANDLE_KEY = "images-directory";

    const chooseBtn = document.getElementById("chooseBtn");
    const foldersEl = document.getElementById("folders");
    const gridWrap = document.getElementById("gridWrap");
    const currentFolderEl = document.getElementById("currentFolder");
    const folderCountEl = document.getElementById("folderCount");
    const imageCountEl = document.getElementById("imageCount");
    const toast = document.getElementById("toast");

    const IMAGE_EXTENSIONS = new Set(["jpg", "jpeg", "png", "gif", "webp", "avif", "bmp", "svg"]);

    let folderMap = new Map();
    let sortedFolders = [];
    let folderElements = new Map();
    let selectedFolder = null;
    let toastTimer = null;
    let jumpTimer = null;

    chooseBtn.addEventListener("click", openImagesDirectory);
    document.addEventListener("keydown", handleSidebarLetterJump);

    restoreImagesDirectory();

    async function restoreImagesDirectory() {
      if (!("showDirectoryPicker" in window)) {
        showFolderMessage("Dieser Browser kann Ordner nicht dauerhaft speichern. Bitte Chrome oder Edge verwenden.");
        chooseBtn.disabled = true;
        return;
      }

      try {
        const handle = await readSavedHandle();
        if (!handle) {
          showFolderMessage("Beim ersten Mal den Ordner C:\\Users\\PC\\OneDrive\\Desktop\\images freigeben.");
          return;
        }

        const permission = await handle.queryPermission({ mode: "read" });
        if (permission === "granted") {
          await loadDirectory(handle);
        } else {
          chooseBtn.textContent = "Zugriff bestätigen";
          showFolderMessage("Einmal klicken, um den gespeicherten Bilderordner wieder freizugeben.");
        }
      } catch (err) {
        showFolderMessage("Der gespeicherte Bilderordner konnte nicht geladen werden.");
      }
    }

    async function openImagesDirectory() {
      try {
        let handle = await readSavedHandle();

        if (handle) {
          const permission = await handle.requestPermission({ mode: "read" });
          if (permission !== "granted") return;
        } else {
          handle = await window.showDirectoryPicker({ id: "image-links-folder", mode: "read" });
          if (handle.name.toLocaleLowerCase() !== LOCAL_ROOT_FOLDER_NAME) {
            showToast(`Bitte nur den Ordner "${LOCAL_ROOT_FOLDER_NAME}" auswählen`);
            return;
          }
          await saveHandle(handle);
        }

        await loadDirectory(handle);
        showToast("Bilder neu geladen");
      } catch (err) {
        if (err?.name !== "AbortError") showToast("Bilderordner konnte nicht geöffnet werden");
      }
    }

    async function loadDirectory(handle) {
      const items = [];
      revokePreviewUrls();
      await collectImages(handle, [], items);
      buildFolderMap(items);
      renderFolders();
      chooseBtn.textContent = "Neu laden";

      const firstFolder = sortedFolders[0];
      if (firstFolder) {
        selectFolder(firstFolder);
      } else {
        currentFolderEl.textContent = "Keine Bilder gefunden";
        imageCountEl.textContent = "0 Bilder";
        gridWrap.innerHTML = `<div class="empty">Keine Bilder oder GIFs gefunden.</div>`;
      }
    }

    async function collectImages(directoryHandle, pathParts, items) {
      for await (const [name, entry] of directoryHandle.entries()) {
        if (entry.kind === "directory") {
          await collectImages(entry, [...pathParts, name], items);
          continue;
        }

        if (!isImageName(name)) continue;
        const file = await entry.getFile();
        const bucketPath = [...pathParts, name].join("/");
        items.push({
          file,
          fileName: name,
          folderName: pathParts.join("/") || "Root",
          bucketPath,
          previewUrl: URL.createObjectURL(file),
          cloudflareUrl: CLOUDFLARE_DOMAIN + "/" + encodePath(bucketPath),
        });
      }
    }

    function openHandleDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(HANDLE_DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(HANDLE_STORE_NAME);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function readSavedHandle() {
      const db = await openHandleDatabase();
      return new Promise((resolve, reject) => {
        const request = db.transaction(HANDLE_STORE_NAME).objectStore(HANDLE_STORE_NAME).get(HANDLE_KEY);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      }).finally(() => db.close());
    }

    async function saveHandle(handle) {
      const db = await openHandleDatabase();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(HANDLE_STORE_NAME, "readwrite");
        transaction.objectStore(HANDLE_STORE_NAME).put(handle, HANDLE_KEY);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
      }).finally(() => db.close());
    }

    function showFolderMessage(message) {
      foldersEl.innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
      gridWrap.innerHTML = `<div class="empty">Keine Bilder geladen</div>`;
    }

    function revokePreviewUrls() {
      for (const items of folderMap.values()) {
        for (const item of items) URL.revokeObjectURL(item.previewUrl);
      }
    }

    function isImageName(name) {
      const ext = (name.split(".").pop() || "").toLowerCase();
      return IMAGE_EXTENSIONS.has(ext);
    }

    function buildFolderMap(items) {
      folderMap = new Map();
      selectedFolder = null;

      for (const item of items) {
        if (!folderMap.has(item.folderName)) folderMap.set(item.folderName, []);
        folderMap.get(item.folderName).push(item);
      }

      for (const folderItems of folderMap.values()) {
        folderItems.sort((a, b) => a.fileName.localeCompare(b.fileName, undefined, { numeric: true }));
      }

      sortedFolders = [...folderMap.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function renderFolders() {
      folderCountEl.textContent = String(sortedFolders.length);
      folderElements = new Map();

      if (!sortedFolders.length) {
        foldersEl.innerHTML = `<div class="empty">Keine Ordner gefunden</div>`;
        return;
      }

      foldersEl.innerHTML = "";

      for (const folder of sortedFolders) {
        const div = document.createElement("div");
        div.className = "folder" + (folder === selectedFolder ? " active" : "");
        div.dataset.folder = folder;
        div.innerHTML = `
          <div>📁</div>
          <div class="folderName">${escapeHtml(folder)}</div>
          <div class="muted">${folderMap.get(folder).length}</div>
        `;
        div.addEventListener("click", () => selectFolder(folder));
        foldersEl.appendChild(div);
        folderElements.set(folder, div);
      }
    }

    function selectFolder(folder) {
      selectedFolder = folder;
      renderFolders();
      renderGrid(folderMap.get(folder) || []);
    }

    function handleSidebarLetterJump(event) {
      if (event.ctrlKey || event.altKey || event.metaKey || event.key.length !== 1) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/i.test(document.activeElement?.tagName || "")) return;

      const letter = event.key.toLocaleLowerCase();
      if (!/^[a-z0-9]$/i.test(letter) || !sortedFolders.length) return;

      const targetIndex = findFolderJumpIndex(letter);
      const folder = sortedFolders[targetIndex];
      const targetEl = folderElements.get(folder);
      if (!targetEl) return;

      event.preventDefault();
      targetEl.scrollIntoView({ block: "center", behavior: "smooth" });
      targetEl.classList.add("jumpTarget");

      clearTimeout(jumpTimer);
      jumpTimer = setTimeout(() => targetEl.classList.remove("jumpTarget"), 900);

      if (!folder.toLocaleLowerCase().startsWith(letter)) {
        showToast(`Keine Ordner mit "${letter}"`);
      }
    }

    function findFolderJumpIndex(letter) {
      const needle = letter.toLocaleLowerCase();
      const exactIndex = sortedFolders.findIndex(folder => folder.toLocaleLowerCase().startsWith(needle));
      if (exactIndex !== -1) return exactIndex;

      const insertionIndex = sortedFolders.findIndex(folder => folder.toLocaleLowerCase().localeCompare(needle) > 0);
      if (insertionIndex !== -1) return insertionIndex;
      return sortedFolders.length - 1;
    }

    function renderGrid(items) {
      currentFolderEl.textContent = selectedFolder || "Kein Ordner gewählt";
      imageCountEl.textContent = `${items.length} Bilder`;

      if (!items.length) {
        gridWrap.innerHTML = `<div class="empty">Dieser Ordner enthält keine Bilder</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "imageGrid";

      for (const item of items) {
        const card = document.createElement("div");
        card.className = "imageCard";
        card.title = "Klicken = Link kopieren";
        card.innerHTML = `<img src="${item.previewUrl}" alt="" loading="lazy">`;
        card.addEventListener("click", () => copyLink(item.cloudflareUrl));
        grid.appendChild(card);
      }

      gridWrap.innerHTML = "";
      gridWrap.appendChild(grid);
    }

    async function copyLink(url) {
      try {
        await navigator.clipboard.writeText(url);
      } catch (err) {
        const textarea = document.createElement("textarea");
        textarea.value = url;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast("Bildlink kopiert");
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
